[workspace]
members = ["crates/netfilum-client", "crates/netfilum-server"]
default-members = ["."]

[package]
name = "netfilum"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }

[patch.crates-io]
winfsp-sys = { path = "vendor/winfsp-sys" }
