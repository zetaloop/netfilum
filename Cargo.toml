[workspace]
members = ["crates/netfilum-client", "crates/netfilum-server"]
default-members = ["."]

[package]
name = "netfilum"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }

[patch.crates-io]
winfsp-sys = { path = "vendor/winfsp-sys" }
